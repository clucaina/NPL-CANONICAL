name: Jardín Sináptico - pulso comprobable (SIN DESPLIEGUE)
on:
  workflow_dispatch:
  push:
    paths:
      - 'cloud_factory/neural_garden.py'
      - 'cloud_factory/garden_view.html'
      - 'cloud_factory/test_neural_garden.py'
      - 'cloud_factory/public_site_parity.py'
      - 'cloud_factory/test_public_site_parity.py'
      - '.github/workflows/neural-garden.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: garden-synaptic-pulse
  cancel-in-progress: false
jobs:
  public-pulse:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove root isolation, privacy membrane and fairness
        run: python3 -m unittest discover -s cloud_factory -p 'test_neural_garden.py' -v
      - name: Test original public Site release signals without private source
        run: python3 -m unittest discover -s cloud_factory -p 'test_public_site_parity.py' -v
      - name: Inspect original Site without editing, emails, new jobs or storage
        run: python3 cloud_factory/public_site_parity.py --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Build fresh evidence-anchored orchard snapshot and interactive offline dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 cloud_factory/neural_garden.py --out garden-output --html cloud_factory/garden_view.html
      - name: Summarize only public traceable evidence
        run: cat garden-output/status.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive privacy-safe dashboard and machine-readable state
        uses: actions/upload-artifact@v4
        with:
          name: JARDIN_SINAPTICO_EVIDENCIAS_PUBLICAS
          path: garden-output/
          if-no-files-found: error
          retention-days: 14
      - name: Confirm no automatic email or GitHub issue comment delivery
        run: |
          echo "SILENT_EVIDENCE_DELIVERY=WORKFLOW_SUMMARY_AND_ARTIFACTS_ONLY" >> "$GITHUB_STEP_SUMMARY"
          test -s garden-output/status.md
          test -s garden-output/snapshot.json
