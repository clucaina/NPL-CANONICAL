name: Jardín Sináptico - pulso comprobable (SIN DESPLIEGUE)
on:
  workflow_dispatch:
  push:
    paths:
      - 'cloud_factory/neural_garden.py'
      - 'cloud_factory/garden_view.html'
      - 'cloud_factory/test_neural_garden.py'
      - '.github/workflows/neural-garden.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: garden-synaptic-pulse
  cancel-in-progress: false
jobs:
  public-pulse:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove root isolation, privacy membrane and fairness
        run: python3 -m unittest discover -s cloud_factory -p 'test_neural_garden.py' -v
      - name: Build fresh evidence-anchored orchard snapshot and interactive offline dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 cloud_factory/neural_garden.py --out garden-output --html cloud_factory/garden_view.html
      - name: Summarize only public traceable evidence
        run: cat garden-output/status.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive privacy-safe dashboard and machine-readable state
        uses: actions/upload-artifact@v4
        with:
          name: JARDIN_SINAPTICO_EVIDENCIAS_PUBLICAS
          path: garden-output/
          if-no-files-found: error
          retention-days: 14
      - name: Notify only on meaningful changes, never log private content
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          GARDEN_STATE: garden-output/snapshot.json
        with:
          script: |
            const fs=require('fs');
            const crypto=require('crypto');
            const snap=JSON.parse(fs.readFileSync(process.env.GARDEN_STATE,'utf8'));
            // Only a latest unresolved failure PER workflow + branch is evidence.
            // Passing unrelated checks and new cron runs are not new achievements.
            const observed=snap.roots.filter(p=>p.source&&Array.isArray(p.failure_evidence)&&p.failure_evidence.length)
              .map(p=>({id:p.id,status:'CHECKS_FAILED',
                failures:p.failure_evidence.map(r=>({name:r.name,branch:r.branch,url:r.url}))
                  .sort((a,b)=>a.url.localeCompare(b.url))}))
              .sort((a,b)=>a.id.localeCompare(b.id));
            if(!observed.length){console.log('No fresh failed checks requiring an evidence bulletin');return;}
            const fingerprint=crypto.createHash('sha256').update(JSON.stringify(observed)).digest('hex');
            const marker='<!-- garden-evidence:'+fingerprint+' -->';
            const {owner,repo}=context.repo;
            const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:6,per_page:100});
            if(comments.some(c=>typeof c.body==='string'&&c.body.includes(marker))){
              console.log('The same unresolved failures were already reported');return;
            }
            const rows=observed.flatMap(p=>p.failures.map(r=>
              '- '+p.id+': CHECKS_FAILED ('+r.name+' · '+r.branch+') · '+r.url));
            const body=marker+'\\n### Fallos de CI pendientes de comprobación\\n'+rows.join('\\n')+
              '\\n\\n[Ver ejecución y visor offline]('+context.serverUrl+'/'+owner+'/'+repo+'/actions/runs/'+context.runId+')'+
              '\\n\\n*Un CI fallido no demuestra una regresión en la web desplegada; un CI correcto tampoco valida renders, investigación o despliegues. Sin datos privados.*';
            await github.rest.issues.createComment({owner,repo,issue_number:6,body});
