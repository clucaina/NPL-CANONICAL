name: NeuroCity · recuperar mundo maestro original y teselas (NO DEPLOY)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/neurocity-worldmaster-recovery-qa.yml'
      - 'tools/neurocity/worldmaster_recovery.py'
      - 'tools/neurocity/render_worldmaster_cpu.py'
      - 'tools/neurocity/test_render_worldmaster_cpu.py'
      - 'tools/neurocity/recover_worldmaster_sidecars.py'
      - 'tools/neurocity/test_recover_worldmaster_sidecars.py'
      - 'tools/neurocity/continuity_gate.py'
      - 'tools/neurocity/test_continuity_gate.py'
      - 'tools/neurocity/build_local_playable_checkpoint.py'
      - 'tools/neurocity/test_build_local_playable_checkpoint.py'
      - 'tools/factory/coast_inventory.py'
      - 'tools/factory/test_coast_inventory.py'
      - 'demos/npl-world/open_city_pipeline/build_blender.py'
      - 'tools/neurocity/export_local_worldmaster.py'
      - 'tools/neurocity/test_worldmaster_recovery.py'
      - 'tools/neurocity/spain_tile_factory.py'
      - 'tools/neurocity/test_spain_tile_factory.py'
      - 'tools/neurocity/examples/alicante_4tile_production_input.json'
      - 'demos/npl-world/visual_viewer/geo_alignment.mjs'
      - 'demos/npl-world/visual_viewer/city_tiles.mjs'
      - 'demos/npl-world/visual_viewer/world_master_loader.mjs'
      - 'demos/npl-world/visual_viewer/world_physics.mjs'
      - 'demos/npl-world/visual_viewer/tests/world_physics.test.mjs'
      - 'demos/npl-world/visual_viewer/water_surface.mjs'
      - 'demos/npl-world/visual_viewer/tests/water_source_integration.test.mjs'
      - 'demos/npl-world/visual_viewer/tests/water_surface.test.mjs'
      - 'demos/npl-world/visual_viewer/canonical_npl_contract.mjs'
      - 'demos/npl-world/visual_viewer/tests/canonical_npl_contract.test.mjs'
      - 'demos/npl-world/visual_viewer/explanada_mosaic.mjs'
      - 'demos/npl-world/visual_viewer/urban_kit_layout.mjs'
      - 'demos/npl-world/visual_viewer/urban_kit.mjs'
      - 'demos/npl-world/visual_viewer/npl_behavior.mjs'
      - 'demos/npl-world/visual_viewer/npl_brain3d.mjs'
      - 'demos/npl-world/visual_viewer/facade_stucco.mjs'
      - 'demos/npl-world/visual_viewer/tests/mosaic_brain.test.mjs'
      - 'demos/npl-world/visual_viewer/tests/facade_stucco.test.mjs'
      - 'demos/npl-world/visual_viewer/asset_instancing.mjs'
      - 'demos/npl-world/visual_viewer/tests/asset_instancing.test.mjs'
      - 'demos/npl-world/visual_viewer/osm_building_mask.mjs'
      - 'demos/npl-world/visual_viewer/tests/osm_building_mask.test.mjs'
      - 'demos/npl-world/visual_viewer/tests/recovered_master_tiles.test.mjs'
      - 'demos/npl-world/visual_viewer/app.js'
permissions:
  contents: read
jobs:
  recovery_qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove source SHA256 integrity and offline citypack with synthetic fixtures only
        run: |
          python3 -m unittest discover -s tools/neurocity -p 'test_worldmaster_recovery.py' -v
          python3 -m unittest discover -s tools/neurocity -p 'test_spain_tile_factory.py' -v
          python3 -m unittest discover -s tools/neurocity -p 'test_render_worldmaster_cpu.py' -v
          python3 -m unittest discover -s tools/neurocity -p 'test_recover_worldmaster_sidecars.py' -v
          python3 -m unittest discover -s tools/neurocity -p 'test_continuity_gate.py' -v
          python3 -m unittest discover -s tools/neurocity -p 'test_build_local_playable_checkpoint.py' -v
          python3 -m unittest discover -s tools/factory -p 'test_coast_inventory.py' -v
          python3 tools/neurocity/continuity_gate.py --repo-root . --output /tmp/NEUROCITY_CONTINUITY_QA.json
      - name: Prove Alicante regional 500m plan refuses unsupported measurements and brands
        run: |
          python3 tools/neurocity/spain_tile_factory.py --city-spec tools/neurocity/examples/alicante_4tile_production_input.json --output /tmp/neurocity-alicante-4tiles.json --max-tiles 4
          python3 - <<'PY'
          import json
          doc=json.load(open('/tmp/neurocity-alicante-4tiles.json'))
          assert doc['tiles_planned']==4 and doc['models_generated']==0
          assert doc['original_files_modified']==0
          assert all(all(x['source_status']=='BLOCKED_UNVERIFIED_SOURCE' for x in t['tasks']) for t in doc['tiles'])
          print('PASS: no synthetic source approval; 4 actual work slots; 0 false reconstructed models')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify physical CRS compatibility, tile LOD, native Three scene and fail-safe fallback
        working-directory: demos/npl-world/visual_viewer
        run: |
          npm install --no-audit --no-fund
          node --test tests/recovered_master_tiles.test.mjs tests/asset_instancing.test.mjs tests/osm_building_mask.test.mjs tests/world_physics.test.mjs tests/water_surface.test.mjs tests/water_source_integration.test.mjs tests/mosaic_brain.test.mjs tests/facade_stucco.test.mjs tests/urban_kit.test.mjs tests/canonical_npl_contract.test.mjs
      - name: Confirm city game compiles WITHOUT restored user Drive binaries
        working-directory: demos/npl-world/visual_viewer
        run: npm run build
      - name: Assert no recovered original assets or patients are committed
        run: |
          test ! -d demos/npl-world/visual_viewer/world-master
          test ! -f demos/npl-world/visual_viewer/dist/assets/maya.glb
          test -s demos/npl-world/visual_viewer/dist/game.js
          echo "PASS: source-only recovery; no original unapproved 3D payloads published"
