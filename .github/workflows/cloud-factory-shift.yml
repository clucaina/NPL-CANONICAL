name: Factory independent shift - neurocity (NO DEPLOY)
on:
  workflow_dispatch:
  schedule:
    - cron: '37 */4 * * *'
  push:
    paths:
      - '.github/workflows/cloud-factory-shift.yml'
      - 'cloud_factory/worker.py'
  issues:
    types: [edited]
permissions:
  contents: read
concurrency:
  group: cloud-factory-neurocity
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'issues' || (github.event.issue.number == 3 && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Compile worker and audit the current source without modifying it
        run: |
          python3 -m py_compile source/cloud_factory/worker.py
          python3 source/cloud_factory/worker.py --project neurocity --source source --output cloud-output --run "$GITHUB_RUN_NUMBER"
      - name: Publish concise visual report in this workflow's Summary
        run: cat cloud-output/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save local artifact with one independent HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: factory-neurocity-shift
          path: cloud-output/
          retention-days: 14
          if-no-files-found: error
