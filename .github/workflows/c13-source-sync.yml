name: C13 source sync

on:
  push:
    branches:
      - sync/c13-cognitive-runtime

permissions:
  contents: write

jobs:
  expand-c13-source:
    if: ${{ !contains(github.event.head_commit.message, '[c13-expanded]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: sync/c13-cognitive-runtime
          fetch-depth: 0

      - name: Expand recovery recursively and identify C12 root
        shell: bash
        run: |
          rm -rf /tmp/npl-recovery
          mkdir -p /tmp/npl-recovery/root
          unzip -q NPL-CANONICAL-GITHUB-READY.zip -d /tmp/npl-recovery/root
          python - <<'PY'
          import os, zipfile
          root='/tmp/npl-recovery'
          seen=set()
          for depth in range(4):
              found=[]
              for base, dirs, files in os.walk(root):
                  for name in files:
                      p=os.path.join(base,name)
                      if p in seen or not name.lower().endswith('.zip'):
                          continue
                      seen.add(p)
                      found.append(p)
              if not found: break
              for i,p in enumerate(found):
                  out=p+'.expanded'
                  try:
                      os.makedirs(out, exist_ok=True)
                      with zipfile.ZipFile(p) as z: z.extractall(out)
                      print('EXPANDED',p,'->',out)
                  except Exception as e:
                      print('SKIP_ZIP',p,repr(e))
          PY
          ROOT="$(python - <<'PY'
          import os, json
          candidates=[]
          for base, dirs, files in os.walk('/tmp/npl-recovery'):
              score=0
              if 'package.json' in files:
                  score += 2
                  try:
                      v=json.load(open(os.path.join(base,'package.json'))).get('version','')
                      if 'c12' in str(v): score += 2
                  except Exception: pass
              if os.path.isdir(os.path.join(base,'src/domain/human-model/c12')): score += 8
              if os.path.isdir(os.path.join(base,'src/product/c12')): score += 8
              if os.path.isfile(os.path.join(base,'docs/COGNITIVE_FABRIC_REGISTRY.json')): score += 5
              if os.path.isfile(os.path.join(base,'docs/C12-GATE.json')): score += 4
              if os.path.isfile(os.path.join(base,'NPL-ESTADO.txt')): score += 1
              if score: candidates.append((score,base))
          candidates.sort(reverse=True)
          print('CANDIDATES', candidates[:10])
          if candidates and candidates[0][0] >= 12:
              print('SELECTED='+candidates[0][1])
          PY
          )"
          echo "$ROOT"
          ROOT="$(printf '%s\n' "$ROOT" | sed -n 's/^SELECTED=//p' | tail -1)"
          echo "RECOVERY_ROOT=$ROOT"
          test -n "$ROOT"
          test -d "$ROOT/src/domain/human-model/c12"
          test -d "$ROOT/src/product/c12"
          rsync -a --exclude='.git' "$ROOT"/ ./

      - name: Rebuild and apply C13 delta
        shell: bash
        run: |
          test "$(wc -c < sync/delta/part-002.b64)" -eq 16000
          {
            cat sync/delta/part-000.b64
            cat sync/delta/part-001.b64
            head -c 8000 sync/delta/part-002.b64
            cat sync/delta/part-003.b64
            cat sync/delta/part-004.b64
            tail -c 8000 sync/delta/part-002.b64
            cat sync/delta/part-006.b64
            cat sync/delta/part-007.b64
            cat sync/delta/part-008.b64
            cat sync/delta/part-009.b64
            cat sync/delta/part-010.b64
          } | tr -d '\n' | base64 -d > /tmp/c13-delta-core.tar.xz
          echo "38d633c2dd536d18cb88deb15d976d73aab9a44fd5dfc18f95a5f863d11dda67  /tmp/c13-delta-core.tar.xz" | sha256sum -c -
          tar -xJf /tmp/c13-delta-core.tar.xz -C .

      - name: Verify visible C13 source
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "0.15.0-cognitive-runtime-c13"
          test -f src/domain/human-model/c13/runtime.ts
          test -f src/domain/human-model/c13/systems.ts
          test -f src/product/c13/app.js
          test -f src/product/c13/index.html
          test -f tests/c13/c13-cognitive-runtime.test.mjs
          test -f docs/COGNITIVE_RUNTIME_REGISTRY.json
          test -f docs/EVENT_REGISTRY.json
          test -f docs/PROJECTION_REGISTRY.json
          test -f docs/C13-PROTECTED-HASHES.txt
          test -f src/components/BrainViewer.tsx
          test -f public/assets/brain/manifest.json
          test -f public/assets/brain/brain.glb
          test -d src/domain/human-model/c1
          test -d src/domain/human-model/c7
          test -d src/domain/human-model/c9
          test -d src/domain/human-model/c10
          test -d src/domain/human-model/c11
          test -d src/domain/human-model/c12
          test "$(sha256sum public/assets/brain/brain.glb | awk '{print $1}')" = "76a49ea4526a4880613aec7a02756bd7301b0b9d0680d7cae33e197b672c5453"
          test "$(sha256sum public/assets/brain/manifest.json | awk '{print $1}')" = "36385df49ce862455b864c7ea25e405badab2bd4953a949a2fa4240b1ff549ad"
          test "$(sha256sum src/components/BrainViewer.tsx | awk '{print $1}')" = "bc9f607da0dbc9a321dce9ed2df74d3ffc4670a1c07558951d84e493092a46d8"
          {
            echo "REMOTE_SOURCE_VERSION=0.15.0-cognitive-runtime-c13"
            echo "LOCAL_CANONICAL_CHECKPOINT=beccb5457979af6069668766527779fd09484dc2"
            echo "FEATURE_CHECKPOINT=0dbcba8"
            echo "TESTS=839/839 PASS"
            echo "BRAIN_GATE=FAIL"
            echo "BRAIN_RUNTIME=FAIL"
            echo "CONFLICTOMETRO_RUNTIME=NOT_CONNECTED"
            echo "PRODUCTION=NOT_ELEVATED"
            echo "BRAIN_GLB_SHA256=76a49ea4526a4880613aec7a02756bd7301b0b9d0680d7cae33e197b672c5453"
            echo "MANIFEST_SHA256=36385df49ce862455b864c7ea25e405badab2bd4953a949a2fa4240b1ff549ad"
            echo "BRAINVIEWER_SHA256=bc9f607da0dbc9a321dce9ed2df74d3ffc4670a1c07558951d84e493092a46d8"
          } > docs/REMOTE_SYNC_VERIFY.txt

      - name: Clean bootstrap payload
        shell: bash
        run: |
          rm -rf sync/delta sync/chunks
          rm -f sync/c13-source-no-brain.tar.gz

      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "C13 cognitive runtime: expand canonical source tree [c13-expanded]"
          git push origin HEAD:sync/c13-cognitive-runtime
