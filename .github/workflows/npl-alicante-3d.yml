name: NPL Alicante 3D - open city on free CPU
on:
  schedule:
    - cron: '23 4 * * 2,5'
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/npl-alicante-3d.yml"
      - "demos/npl-world/open_city_pipeline/**"
      - "tools/factory/city_quality.py"
      - "tools/factory/test_city_quality.py"
permissions:
  contents: read
  issues: write
concurrency:
  group: npl-alicante-3d-source-qa
  cancel-in-progress: false
jobs:
  build_city:
    name: OSM + PNOA to real georeferenced GLB (not GTA)
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Test real-geodata quality gate without secrets or internet
        run: python3 -m unittest discover -s tools/factory -p 'test_*.py' -v
      - name: Install free Blender with CPU rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy python3-pil
          blender -b --factory-startup --python-expr "import bpy; print('Blender:',bpy.app.version_string)"
      - name: Fetch public Alicante sources
        working-directory: demos/npl-world/open_city_pipeline
        run: |
          python3 download_city.py
          python3 download_icv_ortho.py
          python3 download_ortho_tiles.py
      - name: Build 3D model and editable Blender source
        working-directory: demos/npl-world/open_city_pipeline
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: blender -b --factory-startup -t 2 --python-exit-code 1 -P build_blender.py
      - name: Optional QA preview with CPU Workbench
        working-directory: demos/npl-world/open_city_pipeline
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: blender -b output/Alicante_REAL_OSM_PNOA.blend -t 2 --python-exit-code 1 -P qa_render_optional.py
      - name: Assert genuine outputs exist
        working-directory: demos/npl-world/open_city_pipeline
        run: |
          test -s output/Alicante_REAL_OSM_PNOA.blend
          test -s output/Alicante_REAL_OSM_PNOA.glb
          test -s output/QA_source_report.json
          python3 -m json.tool output/QA_source_report.json
          ls -lh output
      - name: Validate scene provenance (no false photogrammetry claims)
        run: |
          python3 tools/factory/city_quality.py \
            demos/npl-world/open_city_pipeline/input/alicante.osm \
            demos/npl-world/open_city_pipeline/input/source_manifest.json \
            demos/npl-world/open_city_pipeline/output/QA_source_report.json \
            demos/npl-world/open_city_pipeline/output/Alicante_REAL_OSM_PNOA.glb \
            demos/npl-world/open_city_pipeline/output/QA_independent_provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: NPL_Alicante_real_OSM_PNOA_only_NO_FACE
          path: |
            demos/npl-world/open_city_pipeline/output/
            demos/npl-world/open_city_pipeline/input/source_manifest.json
          retention-days: 14
          if-no-files-found: error
      - name: Preserve only anonymous geodata evidence on project control issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          base=Path("demos/npl-world/open_city_pipeline/output")
          q=json.loads((base/"QA_independent_provenance.json").read_text())
          e=q["evidence"];digest=hashlib.sha256((base/"Alicante_REAL_OSM_PNOA.glb").read_bytes()).hexdigest()
          body=(
              "### Alicante · OSM/PNOA reference — automatic provenance snapshot\n\n"
              f"**QA:** {q['gate']} · buildings {e['scene_exported_buildings']} · "
              f"OSM roads {e['osm_road_ways']} · directly measured height tags {e['osm_explicit_height_tags_valid']} "
              f"({e['height_data_coverage_ratio']*100:.2f}%) · PNOA {e['real_pnoa_ground']} · "
              f"GLB meshes {e['glb_meshes']}.\n\n"
              f"GLB SHA-256: \`{digest}\`\n\n"
              f"Run: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n\n"
              "**Not canonical NeuroCity production**; does not certify photorealism, FPS or NPL/Conflictómetro integration. "
              "Never includes personal data or avatars."
          )
          Path("/tmp/neurocity-evidence.md").write_text(body,encoding="utf-8")
          PY
          gh issue comment 3 --body-file /tmp/neurocity-evidence.md
