name: Modular evidence lab QA
on:
  push:
    branches:
      - "feat/alfabetizacion-evidencia-interactiva-20261012"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check Node version
        run: node --version
      - name: Run isolated tests (no secrets or downloads)
        run: node --test educacion/inferencia-tasa-base/tests/test-base-rate.mjs educacion/fuentes-dependientes/tests/test-provenance.mjs
