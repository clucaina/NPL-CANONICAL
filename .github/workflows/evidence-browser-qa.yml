name: Browser QA · NPL evidence labs
on:
  push:
    branches:
      - "feat/alfabetizacion-evidencia-interactiva-20261012"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise interactions and screenshots
        run: node educacion/tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npl-evidence-browser-qa
          path: qa-artifacts/
          retention-days: 7
