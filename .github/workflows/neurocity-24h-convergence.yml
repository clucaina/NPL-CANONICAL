name: NeuroCity 24h - convergence, build and regressions (NO DEPLOY)

# A scheduled workflow is only active on GitHub's default branch. All tests
# below use owner-controlled public branches; private WorldMaster/Brain GLBs
# and patient files must NEVER be put on this repository.
on:
  workflow_dispatch:
  schedule:
    - cron: '19 * * * *'
  push:
    paths:
      - '.github/workflows/neurocity-24h-convergence.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: neurocity-24h-convergence
  cancel-in-progress: true

jobs:
  converge:
    name: Integrate candidate copies; run real Node tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Identify latest owner-only NeuroCity V7 review branch
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Read ONLY PR metadata; never checkout pull requests from external forks.
          ref=$(gh api "repos/${REPO}/pulls?state=open&per_page=100" |
            jq -r --arg repo "$REPO" '[.[] |
              select(.head.repo.full_name==$repo) |
              select(.head.ref | test("^(feat|fix)/neurocity-(v7|v8|restore-real-npl)")) |
              select(.draft==true) ] |
              sort_by(.number) | last | .head.ref // empty')
          if [ -z "$ref" ]; then
            ref='feat/neurocity-restore-real-npl-canonical-brain-v50-20261020'
          fi
          # Git checkout accepts only repository-owner branches from this allowlist.
          if ! [[ "$ref" =~ ^(feat|fix)/neurocity-[a-zA-Z0-9_/-]+$ ]]; then
            echo "Ref rejected by owner-only allowlist"; exit 3
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout current reviewed V7 descendant (public code only)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.ref }}
          path: city-current
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rehearse independent 3D branches without modifying remote history
        id: integration
        shell: bash
        run: |
          set -u
          mkdir -p reports
          printf '# NeuroCity - verified hourly rehearsal\n\n' > reports/REPORT.md
          printf 'Execution UTC: %s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> reports/REPORT.md
          printf 'Source: newest owner-only review branch descending from NPL/V50 **V7**, checking other independent active G19 improvements, Catastro, coastline and gameplay without repeating already-merged assembly.\n\n' >> reports/REPORT.md
          printf '**Important:** an ephemeral merge is NOT a production merge; a passing test is NOT photographic fidelity or a 60-view validation.\n\n' >> reports/REPORT.md
          printf 'Private original GLBs/avatars are NOT downloaded, read or redistributed by this job.\n\n' >> reports/REPORT.md
          cp -a city-current city-integrated
          git -C city-integrated config user.email 'neurocity-ci@users.noreply.github.com'
          git -C city-integrated config user.name 'NeuroCity CI (temporary)'
          printf 'Reviewed owner branch: %s; SHA: %s\n\n' "${{ steps.candidate.outputs.ref }}" "$(git -C city-current rev-parse HEAD)" >> reports/REPORT.md
          blocked=0
          for pair in \
            'adaptive-G19:feat/neurocity-v7-adaptive-render-quality-20261020' \
            'physical-G13:fix/neurocity-g13-osm-fallback-collision-20261020' \
            'acceptance-48walls:feat/neurocity-g19-acceptance-from-pr41-20261020' \
            'integration-geo:ci/neurocity-multi-source-unification-rehearsal-20261020' \
            'cadastre-browser:feat/neurocity-real-cadastre-playable-webgl-20261020'; do
            label="${pair%%:*}"
            ref="${pair#*:}"
            printf '## %s\n\n' "$label" >> reports/REPORT.md
            if ! git -C city-integrated fetch --no-tags origin \
                 "$ref:refs/remotes/origin/ci-$label" > "reports/fetch-$label.log" 2>&1; then
              printf 'BLOCKED: remote branch unavailable. See fetch log.\n\n' >> reports/REPORT.md
              blocked=1
              continue
            fi
            # A peer capability already present byte-for-byte in the current
            # descendant must not be merged again just to generate conflicts.
            if [ "$label" = 'adaptive-G19' ] &&
               git -C city-integrated cat-file -e HEAD:demos/npl-world/visual_viewer/frame_quality.mjs 2>/dev/null &&
               git -C city-integrated cat-file -e HEAD:demos/npl-world/visual_viewer/bounded_loading.mjs 2>/dev/null &&
               [ "$(git -C city-integrated rev-parse HEAD:demos/npl-world/visual_viewer/frame_quality.mjs)" = "$(git -C city-integrated rev-parse refs/remotes/origin/ci-$label:demos/npl-world/visual_viewer/frame_quality.mjs)" ] &&
               [ "$(git -C city-integrated rev-parse HEAD:demos/npl-world/visual_viewer/bounded_loading.mjs)" = "$(git -C city-integrated rev-parse refs/remotes/origin/ci-$label:demos/npl-world/visual_viewer/bounded_loading.mjs)" ] &&
               grep -q 'setLoadPressure(qualityGovernor.snapshot().tier)' city-integrated/demos/npl-world/visual_viewer/app.js; then
              printf 'ALREADY PORTED: verified frame governor, bounded queue, source hook; skipping redundant merge.\n\n' >> reports/REPORT.md
              continue
            fi
            if git -C city-integrated merge --no-ff --no-edit \
                 "refs/remotes/origin/ci-$label" > "reports/merge-$label.log" 2>&1; then
              printf 'CLEAN ephemeral merge; SHA %s\n\n' "$(git -C city-integrated rev-parse HEAD)" >> reports/REPORT.md
            else
              printf 'BLOCKED: actual source merge conflicts (not silently resolved):\n\n' >> reports/REPORT.md
              git -C city-integrated diff --name-only --diff-filter=U > "reports/conflicts-$label.txt"
              sed 's/^/- /' "reports/conflicts-$label.txt" >> reports/REPORT.md
              printf '\n' >> reports/REPORT.md
              git -C city-integrated merge --abort || true
              blocked=1
            fi
          done
          echo "$blocked" > reports/merge-blocked.txt
          printf '## Source-only regression tests\n\n' >> reports/REPORT.md
          # Current real code tests always run even when peer integration is blocked.
          cd city-current/demos/npl-world/visual_viewer
          if npm install --no-audit --no-fund > ../../../../reports/v7-install.log 2>&1 &&
             node --test tests/*.test.mjs > ../../../../reports/v7-tests.log 2>&1 &&
             npm run build > ../../../../reports/v7-build.log 2>&1; then
            printf 'Current V7 descendant source tests + game bundle: PASS.\n\n' >> ../../../../reports/REPORT.md
            echo PASS > ../../../../reports/v7-result.txt
          else
            printf 'Current V7 descendant source tests or build: FAIL; inspect saved logs.\n\n' >> ../../../../reports/REPORT.md
            echo FAIL > ../../../../reports/v7-result.txt
          fi
          cd ../../../..
          if [ "$blocked" -eq 0 ]; then
            cd city-integrated/demos/npl-world/visual_viewer
            if npm install --no-audit --no-fund > ../../../../reports/integrated-install.log 2>&1 &&
               node --test tests/*.test.mjs > ../../../../reports/integrated-tests.log 2>&1 &&
               npm run build > ../../../../reports/integrated-build.log 2>&1; then
              printf 'Multi-branch integrated tests + game bundle: PASS.\n\n' >> ../../../../reports/REPORT.md
              echo PASS > ../../../../reports/integrated-result.txt
            else
              printf 'Multi-branch integrated tests or build: FAIL; inspect saved logs.\n\n' >> ../../../../reports/REPORT.md
              echo FAIL > ../../../../reports/integrated-result.txt
            fi
            cd ../../../..
          else
            printf 'Multi-branch bundle: NOT TESTED - merge was blocked. No fabricated PASS.\n\n' >> reports/REPORT.md
            echo BLOCKED > reports/integrated-result.txt
          fi
          printf '## Next verified action\n\n' >> reports/REPORT.md
          if [ "$(cat reports/merge-blocked.txt)" != 0 ]; then
            printf 'Resolve listed conflicts in a **new draft integration branch**, preserve source GLB integrity, rerun the browser/physical checks. Do not deploy.\n' >> reports/REPORT.md
          elif [ "$(cat reports/integrated-result.txt)" != PASS ]; then
            printf 'Fix the exact failing tests in an isolated draft PR; do not deploy.\n' >> reports/REPORT.md
          else
            printf 'Proceed to 60 geolocated photo-to-view comparisons and local private WorldMaster integration; no deploy until manual acceptance.\n' >> reports/REPORT.md
          fi
          cat reports/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          # Report failures as FAIL, not a misleading green check. Keep artifacts.
          if [ "$(cat reports/merge-blocked.txt)" != 0 ] ||
             [ "$(cat reports/v7-result.txt)" != PASS ] ||
             [ "$(cat reports/integrated-result.txt)" != PASS ]; then
            echo "NEUROCITY CONVERGENCE BLOCKED: see REPORT.md and conflict paths."
            exit 1
          fi
      - name: Save actual output, conflict paths and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurocity-v7-hourly-qa-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
