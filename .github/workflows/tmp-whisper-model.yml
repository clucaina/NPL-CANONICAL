name: Temporary Whisper Model Fetch

on:
  push:
    branches:
      - tmp-whisper-model-20260904

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper base model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o ggml-base.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin?download=true'
          ls -lh ggml-base.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-ggml-base
          path: ggml-base.bin
          retention-days: 1
          if-no-files-found: error
