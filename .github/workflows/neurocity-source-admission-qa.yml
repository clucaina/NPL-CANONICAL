name: "NeuroCity · free-source provenance and altitude gate (NO DEPLOY)"
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/neurocity/public_free_sources_20261020.json'
      - 'tools/neurocity/source_admission.py'
      - 'tools/neurocity/test_source_admission.py'
      - 'tools/neurocity/official_terrain_probe.py'
      - 'tools/neurocity/test_official_terrain_probe.py'
      - 'tools/neurocity/official_terrain_lod.py'
      - 'tools/neurocity/test_official_terrain_lod.py'
      - 'tools/neurocity/official_terrain_batch.py'
      - 'tools/neurocity/test_official_terrain_batch.py'
      - '.github/workflows/neurocity-source-admission-qa.yml'
permissions:
  contents: read
concurrency:
  group: neurocity-source-admission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce provenance, datum, public metadata and LICENSE security
        run: python3 -m unittest discover -s tools/neurocity -p 'test_source_admission.py' -v
      - name: Write a zero-binary source decision report
        run: |
          python3 tools/neurocity/source_admission.py --output _neurocity_source_qa/report.json
          python3 - <<'PY'
          import json
          p=json.load(open('_neurocity_source_qa/report.json'))
          assert p['schema']=='neurocity.public-source-admission-report.v1'
          assert p['discovered']==12 and p['admitted']==0
          assert p['generated_world_glbs']==0 and p['not_in_city'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NEUROCITY_SOURCE_PROVENANCE_QA_METADATA_ONLY
          path: _neurocity_source_qa/report.json
          retention-days: 7
          if-no-files-found: error

  terrain_real:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free rasterio and pyproj with pinned versions to inspect real GeoTIFF
        run: python3 -m pip install --disable-pip-version-check rasterio==1.4.3 pyproj==3.7.1
      - name: Test exact G12 provenance, EPSG3042 axis conversion and fail-closed source
        run: |
          python3 -m unittest discover -s tools/neurocity -p 'test_official_terrain_probe.py' -v
          python3 -m unittest discover -s tools/neurocity -p 'test_official_terrain_lod.py' -v
      - name: Probe one real Alicante EPSG25830 500m MDT05 COG from IGN IDEE
        run: python3 tools/neurocity/official_terrain_probe.py --mesh-output _neurocity_source_qa/mdt_lod
      - name: Preserve truthful result even if official download is unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUROCITY_OFFICIAL_ALICANTE_MDT05_REAL_PIXELS_QA
          path: _neurocity_source_qa/real_terrain_r01_c02.json
          retention-days: 7
          if-no-files-found: warn

      - name: Archive real official MDT05 LOD candidate GLB, no private models or deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUROCITY_MDT05_REAL_TERRAIN_3_LOD_CANDIDATE_CCBY_NOT_APPROVED
          path: _neurocity_source_qa/mdt_lod/
          retention-days: 1
          if-no-files-found: warn

  four_existing_g19_tiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned free geospatial raster validator
        run: python3 -m pip install --disable-pip-version-check rasterio==1.4.3 pyproj==3.7.1
      - name: Test four original G19 coordinate tuples and deliberate missing tile
        run: python3 -m unittest discover -s tools/neurocity -p 'test_official_terrain_batch.py' -v
      - name: Download official IGN terrain for all four original G19 tiles; no invented coverage
        run: python3 tools/neurocity/official_terrain_batch.py --output _neurocity_four_tile_source
      - name: Upload only public CC-BY official-derived candidates and exact partial-coverage QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEUROCITY_FOUR_G19_TILES_OFFICIAL_MDT05_LOD_CANDIDATES_NOT_APPROVED
          path: _neurocity_four_tile_source/
          retention-days: 1
          if-no-files-found: warn
